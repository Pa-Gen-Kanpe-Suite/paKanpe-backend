name: Backend CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # --- Étape 1 : Execution des tests avant la construction ---
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install .[test] pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: cd-test-secret-with-more-than-thirty-two-characters

  # --- Étape 2 : Build, Push Docker Image & Deploy ---
  build-and-deploy:
    name: Build Docker Image & Deploy
    needs: test # La CD ne se lancera QUE si les tests passent avec succès !
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Conversion du nom de dépôt en minuscules (sécurité GHCR)
      - name: Downcase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest

      - name: Trigger staging deployment
        if: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_WEBHOOK_URL"