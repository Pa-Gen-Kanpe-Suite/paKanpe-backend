name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Lint, Migrate & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pagenkanpe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pagenkanpe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pagenkanpe_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pagenkanpe_test
      JWT_SECRET: ci-secret-with-more-than-thirty-two-characters
      # CORRECTION : 300 secondes (5 minutes) selon les exigences du MVP
      NO_SHOW_GRACE_SECONDS: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Code Quality - Ruff Lint
        run: ruff check app tests

      - name: Code Quality - Ruff Formatting
        run: ruff format --check app tests

      - name: Run Database Migrations
        run: alembic upgrade head

      - name: Run Pytest with Coverage
        run: pytest --cov=app --cov-report=term --cov-fail-under=80