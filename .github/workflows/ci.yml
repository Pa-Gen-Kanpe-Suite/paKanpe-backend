name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pagenkanpe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pagenkanpe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pagenkanpe_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pagenkanpe_test
      JWT_SECRET: ci-secret-with-more-than-thirty-two-characters
      NO_SHOW_GRACE_SECONDS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term --cov-fail-under=80

