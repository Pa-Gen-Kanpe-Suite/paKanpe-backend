name: Backend CI

on:
  pull_request:
    branches: [main, develop, QA/devOPS-branch]
  push:
    branches: [main, develop, QA/devOPS-branch]

jobs:
  test:
    name: Lint, Migrate & Pytest
    runs-on: ubuntu-latest

    # 🐘 Lancement d'un Postgres jetable pour la CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      JWT_SECRET: ci-secret-with-more-than-thirty-two-characters
      NO_SHOW_GRACE_SECONDS: 0  # <--- METTRE A 0 POUR PERMETTRE LE NO-SHOW IMMEDIAT DANS LES TESTS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install --editable . || pip install pydantic pydantic-settings fastapi sqlalchemy; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-cov httpx ruff alembic psycopg[binary]

      - name: Code Quality - Ruff Lint
        run: ruff check --fix app tests

      - name: Code Quality - Ruff Formatting
        run: ruff format app tests
        
      - name: Run Database Migrations
        run: alembic upgrade head

      - name: Run Pytest with Coverage
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=80