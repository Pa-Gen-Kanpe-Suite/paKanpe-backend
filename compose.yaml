services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagenkanpe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagenkanpe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pagenkanpe
      JWT_SECRET: local-compose-secret-with-more-than-thirty-two-characters
      FRONTEND_ORIGINS: http://localhost:3000
      NO_SHOW_GRACE_SECONDS: 300
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:

