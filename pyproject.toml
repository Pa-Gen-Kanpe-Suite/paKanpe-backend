[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pa-gen-kanpe-api"
version = "1.0.0"
description = "API du MVP PA GEN KANPE"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "bcrypt>=4.2,<5",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
    "integration: tests exercising the HTTP API and database",
    "unit: unit tests for service and core functions",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
